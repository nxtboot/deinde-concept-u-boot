    <circle cx="90" cy="74" r="3.5"/>
    <circle cx="48" cy="50" r="3"/>
    <circle cx="112" cy="50" r="3"/>
  </g>

  <!-- boot / power glyph at the crown -->
  <g stroke="#F6C56B" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M84 36.3 A7 7 0 1 1 76 36.3"/>
    <path d="M80 31 L80 43"/>
  </g>

  <!-- IC chip at the base, 8 legs -->
  <rect x="58" y="158" width="44" height="22" rx="3" fill="#A1836A"/>
  <g fill="#F6C56B">
    <rect x="52" y="161" width="6" height="3" rx="1"/>
    <rect x="52" y="166.5" width="6" height="3" rx="1"/>
    <rect x="52" y="172" width="6" height="3" rx="1"/>
    <rect x="52" y="177.5" width="6" height="3" rx="1"/>
    <rect x="102" y="161" width="6" height="3" rx="1"/>
    <rect x="102" y="166.5" width="6" height="3" rx="1"/>
    <rect x="102" y="172" width="6" height="3" rx="1"/>
    <rect x="102" y="177.5" width="6" height="3" rx="1"/>
    <circle cx="64" cy="163" r="1.6"/>
  </g>
