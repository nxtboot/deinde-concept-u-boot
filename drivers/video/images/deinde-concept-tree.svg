<svg width="160" height="190" viewBox="0 0 160 190" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- circuit-trace branches -->
  <g stroke="#A1836A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M80 158 L80 116"/>
    <path d="M80 116 L56 92 L56 64"/>
    <path d="M80 116 L104 92 L104 64"/>
    <path d="M80 116 L80 84"/>
    <path d="M80 84 L62 66 L62 44"/>
    <path d="M80 84 L98 66 L98 44"/>
    <path d="M80 84 L80 50"/>
  </g>
  <g stroke="#A1836A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M56 82 L40 66"/>
    <path d="M104 82 L120 66"/>
  </g>

  <!-- junction nodes -->
  <g fill="#A1836A">
    <circle cx="80" cy="116" r="3.5"/>
    <circle cx="80" cy="84" r="3.5"/>
    <circle cx="56" cy="82" r="3"/>
    <circle cx="104" cy="82" r="3"/>
